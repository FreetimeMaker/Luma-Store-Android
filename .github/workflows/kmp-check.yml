name: Kotlin Multiplatform checks

on:
  push:
    branches:
      - master
      - kmp-migration
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  kmp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile shared and desktop targets
        run: ./gradlew :shared:compileKotlinDesktop :desktopApp:compileKotlin
