name: Build and Release Luma Store

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_release:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect version & create tag
        id: versioncheck
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' androidApp/build.gradle.kts | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Error: Could not detect a valid versionName (expected x.y.z) from androidApp/build.gradle.kts"
            grep -n 'versionName' androidApp/build.gradle.kts || true
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version '$VERSION'. Expected semantic version x.y.z"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Builds run on all branches, but release tags must only be created from master.
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Not on master; skipping tag creation."
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build_linux:
    needs: prepare_release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Keystore Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: keystore

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find and install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Show build environment
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build Tools:"
          ls "$ANDROID_HOME/build-tools"

          echo ""
          echo "NDK:"
          ls "$ANDROID_HOME/ndk"

      - name: Build Android App (Release)
        run: |
          ./gradlew \
            --no-daemon \
            :androidApp:assembleRelease

      - name: Install rpmbuild
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi

      - name: Build Desktop App (Linux Deb + RPM)
        run: |
          ./gradlew \
            --no-daemon \
            :desktopApp:packageDeb \
            :desktopApp:packageRpm

      - name: Configure APKSIGNER
        id: find_apksigner
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "Error: apksigner not found at $APKSIGNER"
            exit 1
          fi

          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

          "$APKSIGNER" version

      - name: Sign Android APK
        id: sign_apk
        run: |
          UNSIGNED_APK="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          SIGNED_APK="Luma-Store-v${{ needs.prepare_release.outputs.version }}.apk"
          KEYSTORE_PATH="./keystore/Luma-Store.jks"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Error: APK not found:"
            echo "$UNSIGNED_APK"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore not found:"
            echo "$KEYSTORE_PATH"
            exit 1
          fi

          echo "Signing APK: $SIGNED_APK"

          "${{ steps.find_apksigner.outputs.apksigner }}" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias alle \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature
        run: |
          "${{ steps.find_apksigner.outputs.apksigner }}" \
            verify \
            --verbose \
            --print-certs \
            "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Show APK checksum
        run: |
          sha256sum "${{ steps.sign_apk.outputs.signed_apk }}"

      - name: Prepare Desktop Artifact
        run: |
          DEB_FILE=$(find \
            desktopApp/build/compose/binaries/main \
            -name "*.deb" \
            | head -n 1)

          if [ -n "$DEB_FILE" ]; then
            echo "Moving $DEB_FILE"
            cp \
              "$DEB_FILE" \
              "Luma-Store-v${{ needs.prepare_release.outputs.version }}.deb"
          else
            echo "Error: No .deb file found"
            exit 1
          fi

      - name: Prepare RPM Artifact
        run: |
          RPM_FILE=$(find \
            desktopApp/build/compose/binaries/main \
            -name "*.rpm" \
            | head -n 1)

          if [ -n "$RPM_FILE" ]; then
            echo "Moving $RPM_FILE"
            cp \
              "$RPM_FILE" \
              "Luma-Store-v${{ needs.prepare_release.outputs.version }}.rpm"
          else
            echo "Error: No .rpm file found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-v${{ needs.prepare_release.outputs.version }}.apk
          path: Luma-Store-v${{ needs.prepare_release.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-v${{ needs.prepare_release.outputs.version }}.deb
          path: Luma-Store-v${{ needs.prepare_release.outputs.version }}.deb
          if-no-files-found: error
          retention-days: 90

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-v${{ needs.prepare_release.outputs.version }}.rpm
          path: Luma-Store-v${{ needs.prepare_release.outputs.version }}.rpm
          if-no-files-found: error
          retention-days: 90

  build_windows:
    needs: prepare_release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Desktop App (Windows MSI + EXE)
        run: |
          ./gradlew `
            --no-daemon `
            :desktopApp:packageMsi `
            :desktopApp:packageExe

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare_release.outputs.version }}"

          $msi = Get-ChildItem `
            -Path desktopApp/build/compose/binaries/main/msi `
            -Filter *.msi |
            Select-Object -First 1

          if ($null -eq $msi) {
            Write-Error "No .msi file found"
            exit 1
          }

          Copy-Item `
            $msi.FullName `
            "Luma-Store-v$ver.msi"

          $exe = Get-ChildItem `
            -Path desktopApp/build/compose/binaries/main/exe `
            -Filter *.exe |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "No .exe file found"
            exit 1
          }

          Copy-Item `
            $exe.FullName `
            "Luma-Store-v$ver.exe"

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-v${{ needs.prepare_release.outputs.version }}.msi
          path: Luma-Store-v${{ needs.prepare_release.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 90

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-v${{ needs.prepare_release.outputs.version }}.exe
          path: Luma-Store-v${{ needs.prepare_release.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - prepare_release
      - build_linux
      - build_windows

    if: needs.prepare_release.outputs.create_tag == 'true'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Luma-Store-v${{ needs.prepare_release.outputs.version }}*
          path: ./dist
          merge-multiple: true

      - name: Show release files
        run: |
          find ./dist -type f -maxdepth 2 -print

      - name: Create release notes
        run: |
          {
            echo "## What's new"
            echo ""
            cat fastlane/metadata/android/en-US/changelogs/default.txt
          } > release-notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare_release.outputs.version }}
          name: Luma Store v${{ needs.prepare_release.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
          draft: false
          generate_release_notes: true
