name: Build KMP Desktop

on:
  push:
    branches:
      - '**'
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build_desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build MSI and EXE
        run: .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-Windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  linux:
    name: Linux desktop packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build DEB and RPM
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: Luma-Store-Linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error
